name: Deploy current production code
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-application
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Package public production files
        run: |
          mkdir public-site
          cp index.html sw.js manifest.json icon-192.png icon-512.png .nojekyll public-site/
          cp -R assets public-site/assets
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public-site
      - uses: actions/deploy-pages@v4
        id: deployment
