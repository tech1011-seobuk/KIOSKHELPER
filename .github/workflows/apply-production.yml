name: 본 서버 적용 (운영 코드만)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-application
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Package public production files
        run: |
          mkdir public-site
          cp index.html sw.js manifest.json icon-192.png icon-512.png .nojekyll public-site/
          cp -R assets public-site/assets
          for file in BufferGeometryUtils.js GLTFLoader.js three.core.js three.module.js camera-geometry.js camera-models.js camera-single-shot.json photoism-model.js photoism-picker.js photoism-callouts.css snapism-model.js snapism-manuals-ui.js snapism-manuals.json guide-search.js guide-search.css editable-manuals.js editable-manuals.json ending-guides-ui.js card-sales-core.js card-sales-ui.js card-sales-xlsx.js; do
            cp -- "$file" public-site/
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public-site
      - uses: actions/deploy-pages@v4
        id: deployment
